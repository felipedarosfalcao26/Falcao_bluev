<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2f66"/>
      <stop offset="55%" stop-color="#071226"/>
      <stop offset="100%" stop-color="#02060c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0b7fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b7fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid1" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <mask id="fade1">
      <rect width="1600" height="900" fill="url(#fadegrad1)"/>
    </mask>
    <radialGradient id="fadegrad1" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg1)"/>
  <rect width="1600" height="900" fill="url(#grid1)" mask="url(#fade1)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>

  <!-- house -->
  <g transform="translate(560,220)" stroke="white" stroke-opacity="0.92" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 40 260 L 40 140 L 240 20 L 440 140 L 440 260 Z"/>
    <rect x="110" y="160" width="90" height="100" fill="#0a2f66" stroke-opacity="0.9"/>
    <rect x="280" y="160" width="90" height="60" fill="#0a2f66" stroke-opacity="0.9"/>
  </g>

  <!-- bolt -->
  <g transform="translate(760,300)">
    <path d="M120 0 L20 150 L90 150 L60 280 L190 90 L110 90 Z" fill="#ffffff"/>
    <path d="M120 0 L20 150 L90 150 L60 280 L190 90 L110 90 Z" fill="#0b7fff" opacity="0.85"/>
  </g>

  <text x="80" y="820" font-family="Arial, sans-serif" font-size="34" fill="rgba(255,255,255,0.55)" letter-spacing="4">BLUEV INSIGHTS</text>
</svg>
