<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2f66"/>
      <stop offset="55%" stop-color="#071226"/>
      <stop offset="100%" stop-color="#02060c"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0b7fff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b7fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid5" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <radialGradient id="fadegrad5" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
    <mask id="fade5">
      <rect width="1600" height="900" fill="url(#fadegrad5)"/>
    </mask>
  </defs>

  <rect width="1600" height="900" fill="url(#bg5)"/>
  <rect width="1600" height="900" fill="url(#grid5)" mask="url(#fade5)"/>
  <rect width="1600" height="900" fill="url(#glow5)"/>

  <!-- balance scale -->
  <g transform="translate(800,180)" fill="none" stroke="white" stroke-opacity="0.92" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="440"/>
    <line x1="-260" y1="40" x2="260" y2="40"/>
    <line x1="-260" y1="40" x2="-260" y2="150"/>
    <line x1="260" y1="40" x2="260" y2="150"/>
    <path d="M -340 150 Q -260 220 -180 150 Z" fill="#0b7fff" fill-opacity="0.85"/>
    <path d="M 180 150 Q 260 220 340 150 Z" fill="#22d3ee" fill-opacity="0.85"/>
    <path d="M -110 440 L 110 440 L 70 480 L -70 480 Z" fill="white" fill-opacity="0.92" stroke="none"/>
  </g>

  <text x="80" y="820" font-family="Arial, sans-serif" font-size="34" fill="rgba(255,255,255,0.55)" letter-spacing="4">BLUEV INSIGHTS</text>
